spring.application.name=RentFlow
server.port=8080

# In-memory H2 database: data is recreated (and re-seeded) on every start
spring.datasource.url=jdbc:h2:mem:rentflowdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# The H2 web console is disabled on purpose: an open database console is a security risk
spring.h2.console.enabled=false

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
